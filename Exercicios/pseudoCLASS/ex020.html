<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo CLASS</title>
    <style>
        div{
            display: inline-block;
            background-color: rgb(53, 51, 48);
            text-align: center;
            height: 200px;
            width: 200px;
        }
        div:hover{
            background-color: rgb(7, 39, 199);
        }

    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
