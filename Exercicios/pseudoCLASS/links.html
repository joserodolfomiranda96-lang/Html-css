<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
         color: red;
         text-decoration: none;
         font-weight: bold;
        }
        a:visited{
            color: blue;
        }
        a:hover{
            color: greenyellow;
            text-decoration: underline;
        }
        a:active{
            color: yellow;
        }
        a::before{
            content:'⇒'
        }
        a::after{
            content: '⥢';
            text-decoration: none;
            font-weight: normal;
            color: rgb(210, 21, 231);
        }
        .especial{
            color: purple;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <li><a href="https://gustavoguanabara.github.io">Repositorio do GitHub</a></li>
    <li><a href="https://youtube.com/cursoemvideo/" class="especial"> Canal do YouTube</a></li>
    <li><a href="https://www.cursoemvideo.com">Site oficial</a></li>
    <p> eu souzz</p>
</body>
</html>
